<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>

  <body>
    <div d-state="{}">
      <span d-html="'<h1>After</h1><script>alert(document.title)</script>'">
        Before
      </span>
    </div>

    <script src="../../../dst/doars.iife.js"></script>
    <script>
      // Wait for the DOM to be interactive.
      document.addEventListener('DOMContentLoaded', () => {
        // Setup a library instance.
        const doars = new window.Doars({
          allowInlineScript: true,
        })
        // Enable library.
        doars.enable()
      })
    </script>
  </body>

</html>
